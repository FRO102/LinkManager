services:
  link-manager:
    build: .
    container_name: link-manager
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - PORT=3000
      - DATA_DIR=/app/data
      # - BACKUP_RETENTION=14           # number of daily backups to keep (default: 14)
      # - LINK_CHECK_INTERVAL_HOURS=24  # how often automatic link checking runs (default: 24h)
